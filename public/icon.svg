<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners for Android App -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner card border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.3" />

  <!-- Central Audio Sound Wave Graphic -->
  <g filter="url(#glow)">
    <!-- Wave bars representing text-to-speech frequency -->
    <rect x="110" y="216" width="28" height="80" rx="14" fill="url(#wave)" />
    <rect x="160" y="166" width="28" height="180" rx="14" fill="url(#wave)" />
    <rect x="210" y="116" width="28" height="280" rx="14" fill="#ffffff" />
    <rect x="260" y="176" width="28" height="160" rx="14" fill="#ffffff" />
    <rect x="310" y="136" width="28" height="240" rx="14" fill="url(#wave)" />
    <rect x="360" y="226" width="28" height="60" rx="14" fill="url(#wave)" />
  </g>

  <!-- Speech bubble indicator dot / spark -->
  <circle cx="390" cy="130" r="16" fill="#38bdf8" />
  <circle cx="390" cy="130" r="8" fill="#ffffff" />
</svg>
